<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luma Two-Voice Registration</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b;
      color: #fafafa; font: 18px/1.5 system-ui, sans-serif; }
    main { width: min(560px, 90vw); text-align: center; }
    #phrase { padding: 18px; border: 1px solid #3f3f46; border-radius: 12px; color: #a7f3d0; }
    button { width: 100%; padding: 22px; margin-top: 18px; border: 0; border-radius: 12px;
      background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { background: #3f3f46; cursor: wait; }
    #status { min-height: 54px; color: #a1a1aa; }
  </style>
</head>
<body>
  <main>
    <h1>Register <span id="person">AB</span></h1>
    <p>Press and hold the button, then say exactly:</p>
    <p id="phrase">My voice is my badge. Authorize datacenter access.</p>
    <button id="record">Hold to record AB</button>
    <p id="status">Tap once to load the models. When ready, press and hold to record.</p>
  </main>
  <script type="module" src="register.js"></script>
</body>
</html>
